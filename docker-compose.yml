services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: preInscriptionForm
    restart: unless-stopped
    ports:
      - "8030:8030"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL:-http://172.16.0.151}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge