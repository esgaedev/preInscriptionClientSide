server {
    listen 8030;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The pre-inscription payload embeds a base64 photo; nginx's 1m default
    # is too small and would reject legitimate submissions with 413.
    client_max_body_size 10m;

    # Docker's embedded DNS resolver. Using a variable in proxy_pass (below)
    # forces nginx to resolve the backend hostname per-request instead of
    # once at startup — if a literal hostname were used directly, nginx
    # would refuse to start entirely whenever that hostname is briefly
    # unresolvable (e.g. the ngrok tunnel not being up yet), taking down
    # the whole static site with it, not just the API proxy.
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $api_backend "strobe-negation-moisture.ngrok-free.dev";

    location /API/ {
        proxy_pass https://$api_backend;
        proxy_set_header Host $api_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "true";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}